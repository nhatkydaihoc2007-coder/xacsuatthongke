<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kho Bài Tập Tự Luận</title>
<script>
window.MathJax = {
  tex: { inlineMath:[["$","$"],["\\(","\\)"]], displayMath:[["$$","$$"],["\\[","\\]"]] },
  options: { skipHtmlTags:["script","noscript","style","textarea","pre"] },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Fira+Code:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Fira+Code:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
/* ── THEME VARS ── */
:root {
  --bg:       #f7f5f0;
  --surface:  #ffffff;
  --card:     #ffffff;
  --border:   #e8e3d9;
  --border2:  #cfc8b8;
  --text:     #1c1a16;
  --muted:    #7a7264;
  --faint:    #b5afa3;
  --accent:   #2a5fd8;
  --acc-lt:   #eaf0fc;
  --acc-dk:   #1d44a8;
  --green:    #1f8c6b;
  --grn-lt:   #eaf7f2;
  --shadow:   0 1px 4px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.04);
  --radius:   12px;
}

[data-theme="dark"] {
  --bg:       #111318;
  --surface:  #181c24;
  --card:     #1e2230;
  --border:   #282f3e;
  --border2:  #3a4258;
  --text:     #e4e8f0;
  --muted:    #8892a8;
  --faint:    #4a5268;
  --accent:   #6b8fff;
  --acc-lt:   #0e1630;
  --acc-dk:   #8aa4ff;
  --green:    #3ecfa0;
  --grn-lt:   #071f16;
  --shadow:   0 1px 4px rgba(0,0,0,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.25s, color 0.25s;
  font-size: 14px;
  line-height: 1.5;
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 60px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
  transition: background 0.25s, border-color 0.25s;
}

.logo-mark {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-family: 'Lora', serif;
  font-size: 18px;
  font-weight: 600;
  flex-shrink: 0;
}

.logo-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}
.logo-name em { color: var(--accent); font-style: normal; }

.hright { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* Theme toggle */
.theme-btn {
  width: 38px; height: 38px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.theme-btn:hover { background: var(--border); }

.admin-link {
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
  padding: 7px 12px;
  border-radius: 7px;
  border: 1px solid var(--border);
  transition: all 0.15s;
  white-space: nowrap;
}
.admin-link:hover { color: var(--accent); border-color: var(--accent); }

/* ── LAYOUT ── */
.layout {
  max-width: 1380px;
  margin: 0 auto;
  padding: 28px 32px;
  display: grid;
  grid-template-columns: 210px minmax(0,1fr) 250px;
  gap: 24px;
}

/* ── SIDEBAR ── */
.sidebar { position: sticky; top: 76px; height: fit-content; max-height: calc(100vh - 92px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; scrollbar-width: thin; }

.sblock {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  transition: background 0.25s, border-color 0.25s;
}

.slabel {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 10px;
}

.search-wrap { position: relative; }
.search-wrap::before {
  content: '⌕';
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--faint); font-size: 16px; pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 8px 12px 8px 32px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: all 0.15s;
}
.search-input:focus { border-color: var(--accent); background: var(--surface); }
.search-input::placeholder { color: var(--faint); }

.subjlist { list-style: none; }
.sitem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  transition: all 0.12s;
  margin-bottom: 2px;
}
.sitem:hover { background: var(--bg); color: var(--text); }
.sitem.active { background: var(--acc-lt); color: var(--accent); font-weight: 500; }

.scnt {
  font-family: 'Fira Code', monospace;
  font-size: 10px;
  background: var(--bg);
  color: var(--faint);
  padding: 2px 7px;
  border-radius: 10px;
  min-width: 22px;
  text-align: center;
  transition: all 0.12s;
}
.sitem.active .scnt { background: var(--surface); color: var(--accent); }

/* ── STATS ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
  transition: background 0.25s, border-color 0.25s;
}
.stat-icon { width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
.stat-n { font-size: 24px; font-weight: 700; font-family: 'Lora', 'Georgia', serif; line-height: 1; }
.stat-l { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ── PAGE HEADER ── */
.page-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.page-title { font-family: 'Lora', 'Georgia', serif; font-size: 22px; font-weight: 400; }
.page-title em { color: var(--accent); font-style: italic; }
.page-cnt { font-size:12px; color:var(--faint); font-family:'Fira Code',monospace; }

/* ── EXERCISE CARD ── */
.ex-list { display: flex; flex-direction: column; gap: 12px; }

.ex-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s, box-shadow 0.2s, background 0.25s;
}
.ex-card:hover { border-color: var(--border2); }

.ex-meta { display:flex; align-items:center; gap:8px; margin-bottom:12px; }

.ex-num {
  font-family: 'Fira Code', monospace;
  font-size: 10px; font-weight: 500;
  color: var(--accent);
  background: var(--acc-lt);
  padding: 2px 8px;
  border-radius: 4px;
}

.ex-tag {
  font-size: 11px; font-weight: 500;
  padding: 3px 9px;
  border-radius: 5px;
}

.ex-chapter {
  font-size: 10px; font-weight: 500;
  padding: 2px 8px;
  border-radius: 5px;
  background: var(--bg);
  color: var(--muted);
  border: 1px solid var(--border);
}

.ex-date { font-size:11px; color:var(--faint); font-family:'Fira Code',monospace; margin-left:auto; }

.ex-question {
  font-family: 'Lora', 'Georgia', 'Times New Roman', serif;
  font-size: 15px;
  font-weight: 300;
  line-height: 1.85;
  margin-bottom: 16px;
}

.ex-footer { display: flex; align-items: center; gap: 8px; }

/* ── SOLUTION TOGGLE ── */
.sol-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 500;
  padding: 6px 14px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.sol-btn:hover, .sol-btn.open {
  border-color: var(--green);
  color: var(--green);
  background: var(--grn-lt);
}
.sol-btn .arr { transition: transform 0.25s; font-size: 10px; display: inline-block; }
.sol-btn.open .arr { transform: rotate(180deg); }

/* ── SOLUTION PANEL ── */
.sol-wrap {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.32s ease, margin-top 0.2s ease;
  overflow: hidden;
  margin-top: 0;
}
.sol-wrap.open { grid-template-rows: 1fr; margin-top: 14px; }
.sol-inner { min-height: 0; overflow: hidden; }
.sol-body {
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.sol-lbl {
  font-family: 'Fira Code', monospace;
  font-size: 9px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--green); margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.sol-lbl::after { content:''; flex:1; height:1px; background: linear-gradient(to right, var(--border), transparent); }
.sol-content {
  font-family: 'Lora', 'Georgia', 'Times New Roman', serif;
  font-size: 14.5px;
  font-weight: 300;
  line-height: 1.95;
  background: var(--grn-lt);
  border-left: 3px solid var(--green);
  padding: 14px 18px;
  border-radius: 0 8px 8px 0;
  transition: background 0.25s;
}

/* ── EMPTY / LOADING ── */
.empty { text-align:center; padding:60px 20px; }
.empty-ico { font-size:44px; opacity:.3; margin-bottom:12px; }
.empty-txt { font-family:'Lora',serif; font-size:18px; font-style:italic; color:var(--faint); }

.loading-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--green));
  animation: loadbar 1.2s ease infinite;
  border-radius: 2px;
  margin-bottom: 24px;
}
@keyframes loadbar { 0%{width:0%} 60%{width:80%} 100%{width:100%} }

/* ── TAG COLORS ── */
.tag-xstk { background: var(--grn-lt); color: var(--green); }
.tag-gt   { background: var(--acc-lt); color: var(--accent); }
.tag-ds   { background: #fef3e8; color: #b85c10; }
.tag-hh   { background: #f3efff; color: #6b21d8; }
.tag-other{ background: var(--bg); color: var(--muted); }

[data-theme="dark"] .tag-ds { background: #2a1600; color: #f0a040; }
[data-theme="dark"] .tag-hh { background: #1a0840; color: #c09cff; }

@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.ex-card { animation: fadeUp 0.3s ease both; }

@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; padding: 16px; }
  .rside { position: static !important; max-height: none !important; overflow: visible !important; order: 1; }
  main { order: 2; }
  .qlist { max-height: 160px; overflow-y: auto; }
  .sidebar { position: static; max-height: none; overflow: visible; padding-right: 0; }
  .subjlist { max-height: 220px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .prog-top { flex-direction: column; align-items: stretch !important; }
  .stats-row { grid-template-columns: repeat(2,1fr); }
  .header { padding: 0 16px; }
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── Math overflow scroll (mobile) ── */
.ex-question, .sol-content {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* ── Multiple choice ── */
.choice-list {
  list-style: none;
  margin: 12px 0 4px 0;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.choice-item {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-family: 'Lora', 'Georgia', serif;
  font-size: 14px;
  font-weight: 300;
  line-height: 1.7;
  transition: background 0.15s, border-color 0.15s;
}
.choice-item.correct {
  border-color: var(--green);
  background: var(--grn-lt);
}
.choice-item.correct .choice-letter {
  color: var(--green);
  font-weight: 600;
}
.choice-letter {
  font-family: 'Fira Code', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: var(--acc-lt);
  padding: 2px 7px;
  border-radius: 5px;
  flex-shrink: 0;
  line-height: 1.6;
}
.choice-item.correct .choice-letter {
  background: var(--green);
  color: #fff;
}
/* Ẩn nhãn đúng/sai khi chưa xem lời giải */
.choices-hidden .choice-item.correct {
  border-color: var(--border);
  background: var(--surface);
}
.choices-hidden .choice-item.correct .choice-letter {
  background: var(--acc-lt);
  color: var(--accent);
  font-weight: 600;
}

/* ── Chọn đáp án tức thì ── */
.choice-item { cursor: pointer; }
.choices-hidden .choice-item:hover { border-color: var(--accent); background: var(--acc-lt); }
.locked .choice-item { cursor: default; }
.choice-item.wrong { border-color: #d64545; background: #fdeeee; }
.choice-item.wrong .choice-letter { background: #d64545; color: #fff; }
[data-theme="dark"] .choice-item.wrong { background: #2a1214; border-color: #e0605f; }
[data-theme="dark"] .choice-item.wrong .choice-letter { background: #e0605f; }
.choice-item.sel { border-color: var(--accent); background: var(--acc-lt); }
.choice-item.sel .choice-letter { background: var(--accent); color: #fff; }

.ex-status { font-size: 11px; font-weight: 600; }
.ex-card.done-ok  { border-left: 4px solid var(--green); }
.ex-card.done-bad { border-left: 4px solid #d64545; }
.ex-card.done-seen{ border-left: 4px solid var(--accent); }
.ex-card.done-ok .ex-status { color: var(--green); }
.ex-card.done-bad .ex-status { color: #d64545; }
.ex-card.done-seen .ex-status { color: var(--accent); }
.mini-btn {
  font-family: inherit; font-size: 12px; padding: 6px 12px; border-radius: 7px;
  border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer;
}
.mini-btn:hover { border-color: var(--accent); color: var(--accent); }
.mini-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.mini-btn.primary:hover { background: var(--acc-dk); color:#fff; }

/* ── Thanh tiến độ ── */
.prog-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.prog-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.prog-text { font-size: 13px; color: var(--muted); }
.prog-text b { color: var(--text); }
.prog-track { height: 6px; background: var(--bg); border-radius: 4px; margin: 10px 0; overflow: hidden; display: flex; }
.prog-ok { background: var(--green); transition: width .3s; }
.prog-bad { background: #d64545; transition: width .3s; }
.prog-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: inherit; font-size: 12px; padding: 4px 11px; border-radius: 14px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
.chip.active { background: var(--acc-lt); border-color: var(--accent); color: var(--accent); font-weight: 500; }

/* ── Đề ngẫu nhiên ── */
.rand-btn { font-family: inherit; font-size: 12px; font-weight: 500; padding: 8px 13px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
.rand-btn:hover { background: var(--acc-dk); }
.ov { position: fixed; inset: 0; background: var(--bg); z-index: 300; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.ov[hidden] { display: none; }
.ov-box { max-width: 820px; margin: 0 auto; padding: 24px 18px 60px; }
.ov h2 { font-family: 'Lora', serif; font-weight: 400; font-size: 22px; margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field label.fl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
.field select, .field input[type=number] { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; cursor: pointer; }
.chaplist { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; max-height: 190px; overflow-y: auto; background: var(--surface); }
.pool-info { font-size: 13px; color: var(--muted); margin: 6px 0 16px; }
.ex-bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.timer { font-family: 'Fira Code', monospace; font-size: 18px; font-weight: 600; }
.timer.low { color: #d64545; }
.qgrid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.qdot { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 13px; cursor: pointer; font-family: 'Fira Code', monospace; }
.qdot.ans { background: var(--acc-lt); border-color: var(--accent); color: var(--accent); }
.qdot.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.qdot.ok { background: var(--grn-lt); border-color: var(--green); color: var(--green); }
.qdot.bad { background: #fdeeee; border-color: #d64545; color: #d64545; }
.score-box { text-align: center; padding: 22px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 18px; }
.score-n { font-family: 'Lora', serif; font-size: 44px; font-weight: 600; }
.rv-card { margin-bottom: 14px; }
details.rv-sol { margin-top: 10px; }
details.rv-sol summary { cursor: pointer; font-size: 12px; color: var(--green); }


/* ── Cột phải ── */
.rside { position: sticky; top: 76px; height: fit-content; max-height: calc(100vh - 92px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; scrollbar-width: thin; }
.rside .prog-wrap { padding: 16px; margin-bottom: 14px; }
.rside .prog-top { flex-direction: column; align-items: stretch; }
.rside .prog-btns .mini-btn { flex: 1 1 100%; text-align: left; }
.qlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; max-height: 40vh; overflow-y: auto; scrollbar-width: thin; }
.qn { height: 32px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-family: 'Fira Code', monospace; font-size: 11px; cursor: pointer; padding: 0; }
.qn:hover { border-color: var(--accent); color: var(--accent); }
.qn.ok { background: var(--grn-lt); border-color: var(--green); color: var(--green); }
.qn.bad { background: #fdeeee; border-color: #d64545; color: #d64545; }
[data-theme="dark"] .qn.bad { background: #2a1214; }
.qn.seen { background: var(--acc-lt); border-color: var(--accent); color: var(--accent); }
.ql-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; font-size: 11px; color: var(--faint); }
.lg { display: inline-block; width: 9px; height: 9px; border-radius: 3px; border: 1px solid var(--border2); margin-right: 4px; }
.lg.ok { background: var(--green); border-color: var(--green); } .lg.bad { background: #d64545; border-color: #d64545; } .lg.seen { background: var(--accent); border-color: var(--accent); }


/* ── Giới thiệu tác giả & ủng hộ ── */
.about { max-width: 1380px; margin: 0 auto; padding: 0 32px 48px; }
.about-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 28px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 28px; align-items: start; }
.about-card.no-qr { grid-template-columns: 1fr; }
.ab-role { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
.ab-name { font-family: 'Lora', serif; font-size: 24px; font-weight: 600; line-height: 1.25; }
.ab-sub { font-size: 13px; color: var(--muted); margin: 2px 0 12px; }
.ab-bio { font-size: 14px; line-height: 1.75; max-width: 62ch; }
.ab-acc { margin-top: 14px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); max-width: 440px; }
.ab-acc .bk { font-size: 13px; color: var(--muted); }
.ab-acc .no { font-family: 'Fira Code', monospace; font-size: 20px; font-weight: 600; letter-spacing: .04em; margin-top: 2px; }
.ab-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.ab-links a, .ab-links button { font-family: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); text-decoration: none; cursor: pointer; }
.ab-links a:hover, .ab-links button:hover { border-color: var(--accent); color: var(--accent); }
.ab-links .copy { background: var(--accent); border-color: var(--accent); color: #fff; }
.ab-links .copy:hover { background: var(--acc-dk); color: #fff; }
.ab-qr { text-align: center; width: 200px; }
.ab-qr img { width: 200px; height: 200px; object-fit: contain; background: #fff; border-radius: 10px; border: 1px solid var(--border); padding: 6px; }
.ab-qr div { font-size: 12px; color: var(--faint); margin-top: 6px; }
@media (max-width: 720px) { .about { padding: 0 16px 32px; } .about-card { grid-template-columns: 1fr; padding: 18px; } .ab-qr { margin: 0 auto; } }


/* ── Chọn câu & in đề ── */
.ex-card.sel-on { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.tin { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; }
.sel-btns .mini-btn { flex: 1 1 100%; text-align: left; }
#printArea { position: absolute; left: -10000px; top: 0; width: 180mm; background: #fff; color: #000; font-family: 'Times New Roman', Times, serif; font-size: 12pt; line-height: 1.5; }
#printArea .pd-center { text-align: center; }
#printArea .pd-t { font-size: 15pt; font-weight: bold; margin-bottom: 4px; }
#printArea .pd-h { text-align: center; font-weight: bold; font-size: 13pt; margin: 18px 0 8px; break-after: avoid; }
#printArea .q { margin-top: 10px; break-inside: avoid-page; }
#printArea .c { margin-left: 18px; }
#printArea .c.ok { font-weight: bold; }
#printArea .sol { margin: 4px 0 8px 18px; }
#printArea table { border-collapse: collapse; margin: 6px 0; width: 100%; text-align: center; }
#printArea td { border: 1px solid #888; padding: 3px 6px; }
#printArea img { max-width: 100%; height: auto; }
#printArea mjx-container[display="true"] { overflow: visible; }
@media print {
  @page { size: A4; margin: 16mm 15mm; }
  body { background: #fff !important; overflow: visible !important; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { position: static; left: 0; width: auto; display: block !important; }
}

/* MathJax display math wrapper */
mjx-container[display="true"] {
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  max-width: 100%;
  padding-bottom: 4px;
}
mjx-container {
  max-width: 100%;
}
/* Scrollbar for math on mobile */
mjx-container[display="true"]::-webkit-scrollbar { height: 4px; }
mjx-container[display="true"]::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>

<script>
// ── CONFIG: đổi thành repo của bạn ──
const REPO_OWNER = 'nhatkydaihoc2007-coder';
const REPO_NAME  = 'xacsuatthongke';
const DATA_FILE  = 'data/exercises.json';
// ────────────────────────────────────

// ── THÔNG TIN TÁC GIẢ & ỦNG HỘ: điền vào đây (để trống mục nào thì mục đó ẩn) ──
const AUTHOR = {
  role:     'Tác giả & người duy trì kho bài tập',
  name:     'NKĐH',                         // ← tên hiển thị
  sub:      'một người rảnh rỗi',
  bio:      'Kho bài tập này miễn phí cho mọi người. Nếu thấy hữu ích, bạn có thể mời mình một ly cà phê để duy trì và cập nhật thêm bài.',
  bankName: 'Techcombank',                            // ← VD: 'VPBank'
  bankCode: '',                            // ← mã ngân hàng cho VietQR, VD: 'VPB', 'MB', 'VCB', 'TCB' (có thể để trống nếu dùng qrImage)
  accNo:    '9344903836',                            // ← số tài khoản
  accName:  '',                            // ← tên chủ tài khoản (IN HOA, không dấu)
  qrImage:  'https://i.ibb.co/fVDX03FB/stktcb.png',                            // ← (tùy chọn) đường dẫn ảnh QR riêng, VD: 'donate-qr.png'. Trống = tự tạo QR bằng VietQR
  links: [                                 // ← (tùy chọn) liên kết
    { label: 'Blog Nhật Ký Đại Học', url: 'https://nhatkydaihoc2007.blogspot.com' },
    // { label: 'Facebook', url: 'https://facebook.com/...' },
    // { label: 'nhatkydaihoc2007@gmail.com', url: 'mailto:nhatkydaihoc2007@gmail.com' },
  ]
};
function renderAbout() {
  const A = AUTHOR, e = x => String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const donate = !!A.accNo;
  let qr = A.qrImage;
  if (!qr && donate && A.bankCode) qr = `https://img.vietqr.io/image/${encodeURIComponent(A.bankCode)}-${encodeURIComponent(A.accNo)}-compact2.png` + (A.accName ? `?accountName=${encodeURIComponent(A.accName)}` : '');
  const links = (A.links || []).map(l => `<a href="${e(l.url)}" target="_blank" rel="noopener">${e(l.label)}</a>`).join('');
  if (!A.name && !donate) return;
  const card = document.getElementById('aboutCard');
  card.classList.toggle('no-qr', !qr);
  card.innerHTML = `
    <div>
      ${A.role ? `<div class="ab-role">${e(A.role)}</div>` : ''}
      <div class="ab-name">${e(A.name)}</div>
      ${A.sub ? `<div class="ab-sub">${e(A.sub)}</div>` : ''}
      ${A.bio ? `<div class="ab-bio">${e(A.bio)}</div>` : ''}
      ${donate ? `<div class="ab-acc"><div class="bk">Ngân hàng <b>${e(A.bankName)}</b>${A.accName ? ' · ' + e(A.accName) : ''}</div><div class="no">${e(A.accNo)}</div></div>` : ''}
      <div class="ab-links">${donate ? '<button class="copy" id="copyAcc">Chép số TK</button>' : ''}${links}</div>
    </div>
    ${qr ? `<div class="ab-qr"><img src="${e(qr)}" alt="Mã QR chuyển khoản" loading="lazy" onerror="this.parentNode.style.display='none'"><div>Quét bằng app ngân hàng bất kỳ</div></div>` : ''}`;
  document.getElementById('about').style.display = '';
  if (donate) document.getElementById('donateLink').style.display = '';
  const cb = document.getElementById('copyAcc');
  if (cb) cb.addEventListener('click', () => {
    const done = () => { cb.textContent = 'Đã chép ✓'; setTimeout(() => cb.textContent = 'Chép số TK', 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(A.accNo).then(done, done); else done();
  });
}
renderAbout();

const RAW_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${DATA_FILE}`;

let allExercises = [], allSubjects = [], allChapters = {};
let curSubj = 'all', curChap = 'all', searchQ = '', statusF = 'all';
let progress = {};
try { progress = JSON.parse(localStorage.getItem('ex_progress') || '{}') || {}; } catch (e) { progress = {}; }
function saveProg() { try { localStorage.setItem('ex_progress', JSON.stringify(progress)); } catch (e) {} }
const hasKey = ex => Array.isArray(ex.choices) && ex.choices.length >= 2 && ex.choices.some(c => c.correct);

// ── Theme ──
const saved = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', saved);
const themeBtn = document.getElementById('themeBtn');
themeBtn.textContent = saved === 'dark' ? '☀️' : '🌙';
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
});

// ── Load data ──
async function loadData() {
  try {
    const res = await fetch(RAW_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('fetch failed');
    const json = await res.json();
    allExercises = json.exercises || [];
    allSubjects  = json.subjects  || [];
    allChapters  = json.chapters  || {};
  } catch (e) {
    allExercises = [];
    allSubjects  = [];
    document.getElementById('exList').innerHTML = `<div class="empty"><div class="empty-ico">⚠️</div><div class="empty-txt">Không thể tải dữ liệu. Kiểm tra cấu hình REPO_OWNER và REPO_NAME.</div></div>`;
  }
  document.getElementById('loadingBar').style.display = 'none';
  render();
}

// ── Tag class ──
const TAG_MAP = {
  'Xác suất thống kê': 'tag-xstk',
  'Giải tích': 'tag-gt',
  'Đại số': 'tag-ds',
  'Hình học': 'tag-hh',
};
function tagClass(s) { return TAG_MAP[s] || 'tag-other'; }

// ── Render ──
function render() {
  renderSubjects();
  renderChapters();
  renderStats();
  renderExercises();
}

function renderSubjects() {
  const list = document.getElementById('subjList');
  let html = `<li class="sitem ${curSubj==='all'?'active':''}" data-subj="all">
    <span>Tất cả</span><span class="scnt">${allExercises.length}</span></li>`;
  allSubjects.forEach(s => {
    const c = allExercises.filter(e => e.subject === s).length;
    const esc = s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    html += `<li class="sitem ${curSubj===s?'active':''}" data-subj="${esc}">
      <span>${s}</span><span class="scnt">${c}</span></li>`;
  });
  list.innerHTML = html;
  list.querySelectorAll('.sitem').forEach(li => {
    li.addEventListener('click', () => setSubj(li.dataset.subj, li));
  });
}

function renderChapters() {
  const block = document.getElementById('chapBlock');
  const list  = document.getElementById('chapList');
  const chaps = (curSubj !== 'all' && allChapters[curSubj]) ? allChapters[curSubj] : [];
  if (!chaps.length) {
    block.style.display = 'none';
    curChap = 'all';
    return;
  }
  block.style.display = 'block';
  const exInSubj = allExercises.filter(e => e.subject === curSubj);
  let html = `<li class="sitem ${curChap==='all'?'active':''}" data-chap="all">
    <span>Tất cả</span><span class="scnt">${exInSubj.length}</span></li>`;
  chaps.forEach(ch => {
    const c = exInSubj.filter(e => e.chapter === ch).length;
    const esc = ch.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    html += `<li class="sitem ${curChap===ch?'active':''}" data-chap="${esc}">
      <span>${ch}</span><span class="scnt">${c}</span></li>`;
  });
  list.innerHTML = html;
  list.querySelectorAll('.sitem').forEach(li => {
    li.addEventListener('click', () => {
      curChap = li.dataset.chap;
      list.querySelectorAll('.sitem').forEach(x => x.classList.remove('active'));
      li.classList.add('active');
      renderExercises();
    });
  });
}

function renderStats() {
  const w = new Date(); w.setDate(w.getDate()-7);
  document.getElementById('sTot').textContent  = allExercises.length;
  document.getElementById('sSubj').textContent = allSubjects.length;
  document.getElementById('sNew').textContent  = allExercises.filter(e => new Date(e.createdAt) > w).length;
}

function getBase() {
  return allExercises.filter(e => {
    const ms = curSubj === 'all' || e.subject === curSubj;
    const mc = curChap === 'all' || e.chapter === curChap;
    const q  = searchQ.toLowerCase();
    return ms && mc && (!q || e.question.toLowerCase().includes(q) || (e.solution||'').toLowerCase().includes(q));
  });
}
function getFiltered() {
  const b = getBase();
  if (statusF === 'todo')  return b.filter(e => !progress[e.id]);
  if (statusF === 'done')  return b.filter(e => progress[e.id]);
  if (statusF === 'wrong') return b.filter(e => progress[e.id] && progress[e.id].ok === false);
  return b;
}

function renderExercises() {
  const list = document.getElementById('exList');
  const data = getFiltered();

  document.getElementById('pageCnt').textContent = `${data.length} bài`;
  document.getElementById('pageTitle').innerHTML =
    curSubj === 'all'  ? 'Tất cả <em>bài tập</em>' :
    curChap !== 'all'  ? `<em>${curSubj}</em> · ${curChap}` :
                         `Môn: <em>${curSubj}</em>`;

  if (!data.length) {
    list.innerHTML = `<div class="empty"><div class="empty-ico">🔍</div><div class="empty-txt">Không có bài tập nào.</div></div>`;
    updateProgress();
    return;
  }

  list.innerHTML = data.map((ex, i) => {
    const gi = allExercises.findIndex(e => e.id === ex.id) + 1;
    const d  = new Date(ex.createdAt).toLocaleDateString('vi-VN');
    return `
    <div class="ex-card" style="animation-delay:${i*0.04}s" id="card-${ex.id}">
      <div class="ex-meta">
        <span class="ex-num">#${String(gi).padStart(3,'0')}</span>
        <span class="ex-tag ${tagClass(ex.subject)}">${ex.subject}</span>
        ${ex.chapter ? `<span class="ex-chapter">📖 ${ex.chapter}</span>` : ''}
        <span class="ex-status" id="st-${ex.id}"></span>
        <span class="ex-date">${d}</span>
      </div>
      <div class="ex-question" id="eq-${ex.id}">${ex.question}</div>
      <div id="ch-${ex.id}" class="choices-hidden"></div>
      <div class="ex-footer">
        <button class="sol-btn" id="sb-${ex.id}" onclick="toggleSol('${ex.id}')">
          📖 <span id="sbtxt-${ex.id}">Xem lời giải</span> <span class="arr">▾</span>
        </button>
        <button class="mini-btn" id="mk-${ex.id}" data-mk="${ex.id}" style="display:none"></button>
        <button class="mini-btn" id="sl-${ex.id}" data-sel="${ex.id}" style="margin-left:auto">☐ Chọn vào đề</button>
      </div>
      <div class="sol-wrap" id="sw-${ex.id}">
        <div class="sol-inner">
          <div class="sol-body">
            <div class="sol-lbl">Lời giải</div>
            <div class="sol-content" id="sc-${ex.id}">${ex.solution || '<em style="opacity:.5">Chưa có lời giải.</em>'}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Inject choice blocks từ field ex.choices (array JSON lưu trong GitHub)
  data.forEach(ex => {
    if (!ex.choices || !ex.choices.length) return;
    const chWrap = document.getElementById('ch-'+ex.id);
    if (chWrap) chWrap.innerHTML = renderChoiceHtml(ex.choices);
  });
  data.forEach(ex => { applyChoice(ex.id); markCard(ex.id); markSel(ex.id); });
  updateSelUI();
  updateProgress();

  if (window.MathJax) MathJax.typesetPromise([list]).catch(()=>{});
}

function toggleSol(id) {
  const wrap = document.getElementById('sw-'+id);
  const btn  = document.getElementById('sb-'+id);
  const txt  = document.getElementById('sbtxt-'+id);
  const ch   = document.getElementById('ch-'+id);
  const open = wrap.classList.contains('open');
  wrap.classList.toggle('open', !open);
  btn.classList.toggle('open', !open);
  txt.textContent = open ? 'Xem lời giải' : 'Ẩn lời giải';
  // Reveal / hide correct answer highlight
  if (ch && !ch.classList.contains('locked')) ch.classList.toggle('choices-hidden', open);
  if (!open && window.MathJax) MathJax.typesetPromise([document.getElementById('sc-'+id)]).catch(()=>{});
}

function setSubj(s, el) {
  curSubj = s;
  curChap = 'all';
  document.querySelectorAll('#subjList .sitem').forEach(li => li.classList.remove('active'));
  if (el) el.classList.add('active');
  renderChapters();
  renderExercises();
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value;
  renderExercises();
});

loadData();

// ── Brace-counting extractor: lấy nội dung bên trong {...} tiếp theo ──
function extractBraceContent(s, start) {
  // start phải trỏ vào dấu '{'
  let depth = 0, i = start;
  for (; i < s.length; i++) {
    if (s[i] === '{') depth++;
    else if (s[i] === '}') { depth--; if (!depth) return { content: s.slice(start+1, i), end: i+1 }; }
  }
  return null;
}

// ── Parse \choice{A}{B}{\True C}{D} → trả về mảng {text, correct} ──
function parseChoice(s) {
  // Tìm vị trí \choice
  const idx = s.search(/\\choice\b/);
  if (idx === -1) return null;
  const after = s.slice(idx + 7); // bỏ '\choice'
  const choices = [];
  let pos = 0;
  while (pos < after.length && choices.length < 6) {
    // bỏ whitespace
    while (pos < after.length && /\s/.test(after[pos])) pos++;
    if (after[pos] !== '{') break;
    const res = extractBraceContent(after, pos);
    if (!res) break;
    let text = res.content.trim();
    let correct = false;
    if (text.startsWith('\\True')) {
      correct = true;
      text = text.slice(5).trim(); // bỏ '\True'
    } else if (text.startsWith('\\true')) {
      correct = true;
      text = text.slice(5).trim();
    }
    choices.push({ text, correct });
    pos = res.end;
  }
  return choices.length ? { before: s.slice(0, idx), choices } : null;
}

// ── Render choice block thành HTML ──
function renderChoiceHtml(choices) {
  const letters = ['A','B','C','D','E','F'];
  const items = choices.map((c, i) =>
    `<li class="choice-item${c.correct?' correct':''}" data-i="${i}">` +
    `<span class="choice-letter">${letters[i]}</span>` +
    `<span class="choice-text">${ctexInner(c.text)}</span>` +
    `</li>`
  ).join('');
  return `<ul class="choice-list">${items}</ul>`;
}

// ── LaTeX → HTML parser ──────────────────────────────────
// ctexInner: xử lý nội dung đã tách riêng (không có \choice)
function ctexInner(raw) {
  if (!raw) return '';
  let t = raw;
  t = t.replace(/\\dfrac/g, '\\frac');
  t = t.replace(/\\displaystyle\s*/g, '');
  const mathBlocks = [];
  function protect(s) {
    s = s.replace(/\\begin\{(align\*?|cases|equation\*?)\}([\s\S]*?)\\end\{\1\}/g, (match, env, inner) => {
      let block = match;
      if (env === 'cases') block = '\\[' + match + '\\]';
      mathBlocks.push(block);
      return '\x00M'+(mathBlocks.length-1)+'\x00';
    });
    s = s.replace(/\\\[([\s\S]*?)\\\]/g,  (_, m) => { mathBlocks.push('\\['+m+'\\]'); return '\x00M'+(mathBlocks.length-1)+'\x00'; });
    s = s.replace(/\$\$([\s\S]*?)\$\$/g,  (_, m) => { mathBlocks.push('$$'+m+'$$');   return '\x00M'+(mathBlocks.length-1)+'\x00'; });
    s = s.replace(/\\\(([\s\S]*?)\\\)/g,  (_, m) => { mathBlocks.push('\\('+m+'\\)'); return '\x00M'+(mathBlocks.length-1)+'\x00'; });
    s = s.replace(/\$([^$\n]+?)\$/g,       (_, m) => { mathBlocks.push('$'+m+'$');     return '\x00M'+(mathBlocks.length-1)+'\x00'; });
    return s;
  }
  function restore(s) {
    let prev; do { prev = s; s = s.replace(/\x00M(\d+)\x00/g, (_, i) => mathBlocks[+i]); } while (s !== prev);
    return s;
  }
  t = protect(t);
  t = t.replace(/\\textbf\{([^}]*)\}/g, '<strong>$1</strong>');
  t = t.replace(/\\textit\{([^}]*)\}/g, '<em>$1</em>');
  t = t.replace(/\\emph\{([^}]*)\}/g,   '<em>$1</em>');
  // \texttt{...}: brace-counting để bắt nội dung nhiều dòng, xử lý \\ và escape HTML riêng
  t = t.replace(/\\texttt\s*\{/g, '\x00TT\x00');
  t = (function applyTexttt(s) {
    let out = '', i = 0;
    while (i < s.length) {
      const idx = s.indexOf('\x00TT\x00', i);
      if (idx === -1) { out += s.slice(i); break; }
      out += s.slice(i, idx);
      let start = idx + 5, depth = 1, j = start;
      for (; j < s.length && depth > 0; j++) {
        if      (s[j] === '\\' && (s[j+1] === '{' || s[j+1] === '}')) j++;
        else if (s[j] === '{') depth++;
        else if (s[j] === '}') depth--;
      }
      const inner = s.slice(start, j - 1);
      const rendered = inner
        .replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\\#/g, '#')
        .replace(/\\&/g, '&amp;')
        .replace(/\\setminus/g, '\\')
        .replace(/\\\{/g, '{').replace(/\\\}/g, '}')
        .replace(/\\indent\s*/g, '&nbsp;&nbsp;&nbsp;&nbsp;')
        .replace(/\\quad\s*/g, '&nbsp;&nbsp;&nbsp;&nbsp;')
        .replace(/\\\\/g, '<br>');
      out += '<code style="font-family:\'Fira Code\',monospace;background:rgba(128,128,128,.10);padding:2px 6px;border-radius:4px;font-size:0.9em;display:inline;white-space:pre-wrap;word-break:break-all">' + rendered + '</code>';
      i = j;
    }
    return out;
  })(t);
  t = t.replace(/\\underline\{([^}]*)\}/g, '<u>$1</u>');
  t = t.replace(/\\textcolor\{[^}]*\}\{([^}]*)\}/g, '$1');
  t = t.replace(/\\includegraphics(?:\[.*?\])?\{([^}]+)\}/g, '<img src="$1" style="max-width:100%;height:auto;display:block;margin:14px auto;border-radius:6px;box-shadow:var(--shadow);" alt="Hình minh họa">');
  t = t.replace(/\\begin\{itemize\}([\s\S]*?)\\end\{itemize\}/g, (_, inner) => {
    const items = inner.split(/\\item\s*/).filter(s => s.trim());
    return '<ul style="margin:8px 0 8px 22px;line-height:1.85">' + items.map(i => '<li>'+i.trim()+'</li>').join('') + '</ul>';
  });
  t = t.replace(/\\begin\{enumerate\}([\s\S]*?)\\end\{enumerate\}/g, (_, inner) => {
    const items = inner.split(/\\item\s*/).filter(s => s.trim());
    return '<ol style="margin:8px 0 8px 22px;line-height:1.85">' + items.map(i => '<li>'+i.trim()+'</li>').join('') + '</ol>';
  });
  t = t.replace(/\\begin\{center\}([\s\S]*?)\\end\{center\}/g, '<div style="text-align:center;margin:8px 0">$1</div>');
  t = t.replace(/\\begin\{(?:table|tabular)\}(?:\[.*?\])?\{[^}]*\}([\s\S]*?)\\end\{(?:table|tabular)\}/g, (_, inner) => {
    const rows = inner.split(/\\\\/).map(r => r.replace(/\\hline/g,'').trim()).filter(r => r);
    const html = rows.map(row => '<tr>' + row.split('&').map(c => '<td style="padding:5px 12px;border:1px solid var(--border)">'+c.trim()+'</td>').join('') + '</tr>').join('');
    return '<div style="overflow-x:auto;margin:10px 0"><table style="border-collapse:collapse;font-size:14px">'+html+'</table></div>';
  });
  t = t.replace(/\\medskip/g, '<div style="height:10px"></div>');
  t = t.replace(/\\bigskip/g, '<div style="height:18px"></div>');
  t = t.replace(/\\smallskip/g, '<div style="height:5px"></div>');
  t = t.replace(/\\noindent\s*/g, '');
  t = t.replace(/\\newline/g, '<br>');
  t = t.replace(/\\par\b/g, '<br>');
  t = t.replace(/\\\\/g, '<br>');
  t = t.replace(/\\[a-zA-Z]+\*?\{([^}]*)\}/g, '$1');
  t = t.replace(/\\[a-zA-Z]+\*?\s*/g, ' ');
  t = restore(t);
  return t.trim();
}

// ctex: entry point — tách \choice ra trước, xử lý phần còn lại bằng ctexInner
// Trả về { html, choiceHtml } — choiceHtml có thể null nếu không có \choice
function ctex(raw) {
  if (!raw) return '';
  const parsed = parseChoice(raw);
  if (parsed) {
    // Có \choice: trả về question text + lưu choiceHtml riêng qua _lastChoiceHtml
    ctex._lastChoiceHtml = renderChoiceHtml(parsed.choices);
    return ctexInner(parsed.before);
  }
  ctex._lastChoiceHtml = null;
  return ctexInner(raw);
}

// ══════════ TIẾN ĐỘ & CHỌN ĐÁP ÁN ══════════
function byId(id) { return allExercises.find(e => e.id === id); }

function applyChoice(id) {
  const wrap = document.getElementById('ch-' + id);
  if (!wrap) return;
  const p = progress[id], ex = byId(id);
  const lis = wrap.querySelectorAll('.choice-item');
  lis.forEach(li => li.classList.remove('wrong'));
  if (ex && hasKey(ex) && p && p.c != null) {
    wrap.classList.add('locked');
    wrap.classList.remove('choices-hidden');
    if (p.ok === false && lis[p.c]) lis[p.c].classList.add('wrong');
  } else {
    wrap.classList.remove('locked');
    const open = document.getElementById('sw-' + id);
    if (!(open && open.classList.contains('open'))) wrap.classList.add('choices-hidden');
  }
}

function markCard(id) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const p = progress[id], ex = byId(id);
  card.classList.toggle('done-ok',  !!p && p.ok === true);
  card.classList.toggle('done-bad', !!p && p.ok === false);
  card.classList.toggle('done-seen', !!p && p.ok == null);
  const st = document.getElementById('st-' + id);
  if (st) st.textContent = !p ? '' : p.ok === true ? '✓ Đúng' : p.ok === false ? '✗ Sai' : '✓ Đã làm';
  const mk = document.getElementById('mk-' + id);
  if (mk) {
    if (ex && hasKey(ex)) { mk.style.display = p ? '' : 'none'; mk.textContent = '↺ Làm lại'; }
    else { mk.style.display = ''; mk.textContent = p ? '☑ Đã làm (bỏ đánh dấu)' : '☐ Đánh dấu đã làm'; }
  }
}

function answerQ(id, i) {
  const ex = byId(id);
  if (!ex || !hasKey(ex) || progress[id]) return;
  progress[id] = { c: i, ok: !!ex.choices[i].correct, t: Date.now() };
  saveProg(); applyChoice(id); markCard(id); updateProgress();
}

function updateProgress() {
  const wrap = document.getElementById('progWrap');
  const base = getBase();
  if (!allExercises.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const n = base.length;
  const done = base.filter(e => progress[e.id]).length;
  const ok = base.filter(e => progress[e.id] && progress[e.id].ok === true).length;
  const bad = base.filter(e => progress[e.id] && progress[e.id].ok === false).length;
  document.getElementById('progText').innerHTML =
    `Đã làm <b>${done}/${n}</b>` + (ok + bad ? ` · đúng <b style="color:var(--green)">${ok}</b> · sai <b style="color:#d64545">${bad}</b>` : '');
  document.getElementById('progOk').style.width  = n ? (ok / n * 100) + '%' : '0';
  document.getElementById('progBad').style.width = n ? (bad / n * 100) + '%' : '0';
  const ql = document.getElementById('qList');
  document.getElementById('qlWrap').style.display = n ? '' : 'none';
  ql.innerHTML = base.map((e, i) => {
    const pr = progress[e.id];
    const cls = !pr ? '' : pr.ok === true ? 'ok' : pr.ok === false ? 'bad' : 'seen';
    return `<button class="qn ${cls}" data-id="${e.id}" title="Câu ${i + 1}">${i + 1}</button>`;
  }).join('');
  document.querySelectorAll('#progFilter .chip').forEach(c => c.classList.toggle('active', c.dataset.f === statusF));
}

document.getElementById('exList').addEventListener('click', e => {
  const mk = e.target.closest('[data-mk]');
  if (mk) {
    const id = mk.dataset.mk, ex = byId(id);
    if (progress[id]) delete progress[id]; else if (!(ex && hasKey(ex))) progress[id] = { ok: null, t: Date.now() };
    if (ex && hasKey(ex)) {
      const sw = document.getElementById('sw-' + id), sb = document.getElementById('sb-' + id);
      if (sw) sw.classList.remove('open'); if (sb) sb.classList.remove('open');
      const tx = document.getElementById('sbtxt-' + id); if (tx) tx.textContent = 'Xem lời giải';
    }
    saveProg(); applyChoice(id); markCard(id); updateProgress();
    return;
  }
  const li = e.target.closest('.choice-item');
  if (!li) return;
  const wrap = li.closest('[id^="ch-"]');
  if (!wrap || wrap.classList.contains('locked')) return;
  answerQ(wrap.id.slice(3), +li.dataset.i);
});

document.getElementById('qList').addEventListener('click', e => {
  const b = e.target.closest('.qn'); if (!b) return;
  let el = document.getElementById('card-' + b.dataset.id);
  if (!el) { statusF = 'all'; renderExercises(); el = document.getElementById('card-' + b.dataset.id); }
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.style.outline = '2px solid var(--accent)'; setTimeout(() => el.style.outline = '', 1200); }
});
document.getElementById('progFilter').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  statusF = c.dataset.f; renderExercises();
});
document.getElementById('nextTodo').addEventListener('click', () => {
  const ex = getBase().find(x => !progress[x.id]);
  if (!ex) { alert('Bạn đã làm hết các câu trong mục này 🎉'); return; }
  if (statusF !== 'all' && statusF !== 'todo') { statusF = 'all'; renderExercises(); }
  const el = document.getElementById('card-' + ex.id);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});
document.getElementById('resetProg').addEventListener('click', () => {
  const base = getBase();
  if (!confirm(`Xóa tiến độ của ${base.length} bài đang hiển thị (theo môn/chương)?`)) return;
  base.forEach(e => delete progress[e.id]);
  saveProg(); renderExercises();
});

// ══════════ ĐỀ NGẪU NHIÊN ══════════
const ov = document.getElementById('examOv'), box = document.getElementById('examBox');
let EXM = null, exmTimer = null;
const LET = ['A','B','C','D','E','F'];
document.getElementById('randBtn').addEventListener('click', openSetup);
function closeExam() {
  clearInterval(exmTimer); EXM = null; ov.hidden = true; document.body.style.overflow = '';
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function typeset(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {}); }

function poolFor(subj, chaps, onlyTodo) {
  return allExercises.filter(e => hasKey(e)
    && (subj === 'all' || e.subject === subj)
    && (!chaps || chaps.includes(e.chapter || ''))
    && (!onlyTodo || !progress[e.id]));
}

function openSetup() {
  clearInterval(exmTimer); EXM = null;
  ov.hidden = false; document.body.style.overflow = 'hidden'; ov.scrollTop = 0;
  let cfg = {}; try { cfg = JSON.parse(localStorage.getItem('exam_cfg') || '{}'); } catch (e) {}
  const subs = allSubjects.filter(s => poolFor(s).length);
  const subjSel = (cfg.subj && (cfg.subj === 'all' || subs.includes(cfg.subj))) ? cfg.subj : (curSubj !== 'all' && subs.includes(curSubj) ? curSubj : 'all');
  box.innerHTML = `
    <h2>🎲 Tạo đề ngẫu nhiên</h2>
    <div class="field"><label class="fl">Môn học</label>
      <select id="xSubj"><option value="all">Tất cả môn</option>${subs.map(s => `<option value="${esc(s)}" ${s===subjSel?'selected':''}>${esc(s)} (${poolFor(s).length} câu)</option>`).join('')}</select></div>
    <div class="field" id="xChapF" style="display:none"><label class="fl">Chương</label><div class="chaplist" id="xChaps"></div></div>
    <div class="row2">
      <div class="field"><label class="fl">Số câu</label><input type="number" id="xN" min="1" value="${cfg.n || 20}"></div>
      <div class="field"><label class="fl">Thời gian (phút, 0 = không giới hạn)</label><input type="number" id="xT" min="0" value="${cfg.t != null ? cfg.t : 30}"></div>
    </div>
    <label class="chk"><input type="checkbox" id="xShuf" ${cfg.shuf === false ? '' : 'checked'}> Xáo trộn thứ tự đáp án</label>
    <label class="chk"><input type="checkbox" id="xTodo" ${cfg.todo ? 'checked' : ''}> Chỉ lấy câu chưa làm</label>
    <div class="pool-info" id="xPool"></div>
    <div style="display:flex;gap:8px"><button class="mini-btn primary" id="xStart" style="padding:10px 20px;font-size:14px">Bắt đầu làm bài</button><button class="mini-btn" id="xCancel" style="padding:10px 16px;font-size:14px">Đóng</button></div>`;
  const q = id => document.getElementById(id);
  function chapsSel() {
    const cs = [...document.querySelectorAll('#xChaps input')];
    return cs.length ? cs.filter(c => c.checked).map(c => c.value) : null;
  }
  function drawChaps() {
    const s = q('xSubj').value;
    const list = (s !== 'all' && allChapters[s]) ? allChapters[s].slice() : [];
    const has = list.length && poolFor(s).some(e => !e.chapter);
    if (has) list.push('');
    q('xChapF').style.display = list.length ? '' : 'none';
    q('xChaps').innerHTML = list.map(c => `<label class="chk"><input type="checkbox" value="${esc(c)}" checked> ${c ? esc(c) : '(Chưa phân chương)'} <span style="color:var(--faint)">(${poolFor(s, [c]).length})</span></label>`).join('');
    q('xChaps').querySelectorAll('input').forEach(i => i.addEventListener('change', info));
    info();
  }
  function info() {
    const n = poolFor(q('xSubj').value, chapsSel(), q('xTodo').checked).length;
    q('xPool').textContent = `Có ${n} câu trắc nghiệm phù hợp trong kho.`;
    q('xStart').disabled = !n; q('xStart').style.opacity = n ? 1 : .5;
    return n;
  }
  q('xSubj').addEventListener('change', drawChaps);
  q('xTodo').addEventListener('change', info);
  q('xCancel').addEventListener('click', closeExam);
  q('xStart').addEventListener('click', () => {
    const pool = poolFor(q('xSubj').value, chapsSel(), q('xTodo').checked);
    const n = Math.max(1, Math.min(pool.length, parseInt(q('xN').value) || 1));
    const t = Math.max(0, parseInt(q('xT').value) || 0);
    const shuf = q('xShuf').checked;
    try { localStorage.setItem('exam_cfg', JSON.stringify({ subj: q('xSubj').value, n, t, shuf, todo: q('xTodo').checked })); } catch (e) {}
    startExam(pool, n, t, shuf);
  });
  drawChaps();
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startExam(pool, n, minutes, shuf) {
  const qs = shuffle(pool).slice(0, n).map(ex => {
    const idx = ex.choices.map((_, i) => i);
    return { ex, order: shuf ? shuffle(idx) : idx, ans: null };
  });
  EXM = { qs, cur: 0, start: Date.now(), limit: minutes * 60000, done: false };
  clearInterval(exmTimer);
  if (minutes > 0) exmTimer = setInterval(tick, 500);
  drawExam();
}
function fmt(ms) { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(x).padStart(2, '0'); }
function tick() {
  if (!EXM || EXM.done) return;
  const rem = EXM.limit - (Date.now() - EXM.start);
  const t = document.getElementById('xTimer');
  if (t) { t.textContent = '⏱ ' + fmt(rem); t.classList.toggle('low', rem < 60000); }
  if (rem <= 0) submitExam(true);
}
function drawExam() {
  const E = EXM, q = E.qs[E.cur], ex = q.ex;
  const answered = E.qs.filter(x => x.ans != null).length;
  box.innerHTML = `
    <div class="ex-bar">
      <div class="timer" id="xTimer">${E.limit ? '⏱ ' + fmt(E.limit - (Date.now() - E.start)) : '⏱ Không giới hạn'}</div>
      <div class="prog-text" style="margin-left:6px">Đã trả lời <b>${answered}/${E.qs.length}</b></div>
      <button class="mini-btn primary" id="xSubmit" style="margin-left:auto">Nộp bài</button>
      <button class="mini-btn" id="xQuit">Thoát</button>
    </div>
    <div class="qgrid">${E.qs.map((x, i) => `<button class="qdot ${x.ans != null ? 'ans' : ''} ${i === E.cur ? 'cur' : ''}" data-q="${i}">${i + 1}</button>`).join('')}</div>
    <div class="ex-card" style="animation:none">
      <div class="ex-meta"><span class="ex-num">Câu ${E.cur + 1}/${E.qs.length}</span><span class="ex-tag ${tagClass(ex.subject)}">${esc(ex.subject)}</span>${ex.chapter ? `<span class="ex-chapter">📖 ${esc(ex.chapter)}</span>` : ''}</div>
      <div class="ex-question">${ex.question}</div>
      <ul class="choice-list" id="xCh">${q.order.map((oi, k) => `<li class="choice-item${q.ans === oi ? ' sel' : ''}" data-k="${k}"><span class="choice-letter">${LET[k]}</span><span class="choice-text">${ctexInner(ex.choices[oi].text)}</span></li>`).join('')}</ul>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:14px">
      <button class="mini-btn" id="xPrev" ${E.cur === 0 ? 'disabled style="opacity:.4"' : ''}>← Câu trước</button>
      <button class="mini-btn" id="xNext" ${E.cur === E.qs.length - 1 ? 'disabled style="opacity:.4"' : ''}>Câu sau →</button>
    </div>`;
  const $ = id => document.getElementById(id);
  box.querySelectorAll('.qdot').forEach(b => b.addEventListener('click', () => { E.cur = +b.dataset.q; drawExam(); }));
  $('xCh').addEventListener('click', e => {
    const li = e.target.closest('.choice-item'); if (!li) return;
    const oi = q.order[+li.dataset.k];
    q.ans = (q.ans === oi) ? null : oi;   // bấm lại để bỏ chọn
    drawExam();
  });
  $('xPrev').addEventListener('click', () => { if (E.cur > 0) { E.cur--; drawExam(); ov.scrollTop = 0; } });
  $('xNext').addEventListener('click', () => { if (E.cur < E.qs.length - 1) { E.cur++; drawExam(); ov.scrollTop = 0; } });
  $('xSubmit').addEventListener('click', () => submitExam(false));
  $('xQuit').addEventListener('click', () => { if (confirm('Thoát và bỏ bài làm hiện tại?')) closeExam(); });
  typeset(box);
}
function submitExam(auto) {
  const E = EXM; if (!E || E.done) return;
  const un = E.qs.filter(x => x.ans == null).length;
  if (!auto && un && !confirm(`Còn ${un} câu chưa trả lời. Vẫn nộp bài?`)) return;
  E.done = true; clearInterval(exmTimer);
  const used = Math.min(Date.now() - E.start, E.limit || Infinity);
  const ok = E.qs.filter(x => x.ans != null && x.ex.choices[x.ans].correct).length;
  const n = E.qs.length;
  box.innerHTML = `
    <h2>${auto ? '⏰ Hết giờ!' : 'Kết quả bài làm'}</h2>
    <div class="score-box"><div class="score-n">${ok}/${n}</div>
      <div class="prog-text">${(ok / n * 100).toFixed(0)}% · đúng ${ok} · sai ${E.qs.filter(x => x.ans != null).length - ok} · bỏ trống ${un} · thời gian ${fmt(used)}</div></div>
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">

// ── Dựng HTML đề thi (dùng chung cho PDF và Word) ──
function docHtml(o) {
  pruneSel();
  let items = selIds.map(byId).filter(Boolean);
  if (o.shufQ) items = shuffle(items);
  const h = [];
  h.push('<div class="pd-center pd-t">' + esc(o.title || 'ĐỀ THI') + '</div>');
  if (o.sub)  h.push('<div class="pd-center">' + esc(o.sub) + '</div>');
  if (o.time) h.push('<div class="pd-center"><i>Thời gian làm bài: ' + esc(o.time) + '</i></div>');
  if (o.name) h.push('<div class="pd-center" style="margin-top:6px">Họ và tên: ……………………………………………… Lớp: …………………</div>');
  const keys = [], sols = [];
  items.forEach((ex, i) => {
    let s = `<div class="q"><b>Câu ${i + 1}.</b> ${ex.question}</div>`;
    if (Array.isArray(ex.choices) && ex.choices.length) {
      const idx = ex.choices.map((_, k) => k);
      const order = o.shufC ? shuffle(idx) : idx;
      s += order.map((oi, k) => `<div class="c${o.mark && ex.choices[oi].correct ? ' ok' : ''}"><b>${LET[k]}.</b> ${ctexInner(ex.choices[oi].text)}</div>`).join('');
      if (hasKey(ex)) keys.push({ n: i + 1, a: order.map((oi, k) => ex.choices[oi].correct ? LET[k] : '').join('') });
    }
    if (ex.solution) {
      if (o.sol === 'after') s += `<div class="sol"><i>Lời giải.</i> ${ex.solution}</div>`;
      else if (o.sol === 'end') sols.push(`<div class="sol"><b>Câu ${i + 1}.</b> ${ex.solution}</div>`);
    }
    h.push(s);
  });
  if (o.key && keys.length) {
    h.push('<div class="pd-h">ĐÁP ÁN</div>');
    for (let a = 0; a < keys.length; a += 10) {
      const ch = keys.slice(a, a + 10);
      h.push('<table><tr>' + ch.map(k => `<td><b>${k.n}</b></td>`).join('') + '</tr><tr>' + ch.map(k => `<td>${k.a}</td>`).join('') + '</tr></table>');
    }
  }
  if (sols.length) h.push('<div class="pd-h">LỜI GIẢI</div>' + sols.join(''));
  return h.join('');
}

const MJ_SVG_URL = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js';
const JSZIP_URL  = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('không tải được ' + src.split('/').pop())); document.head.appendChild(s); });
}
let svgWin = null;
async function getSvgMJ() {
  if (svgWin) return svgWin;
  const f = document.createElement('iframe');
  f.style.cssText = 'position:absolute;left:-9999px;width:10px;height:10px;border:0';
  f.srcdoc = `<!DOCTYPE html><html><head><script>window.MathJax={svg:{fontCache:'local'},startup:{typeset:false}}<\/script><script src="${MJ_SVG_URL}"><\/script></head><body></body></html>`;
  document.body.appendChild(f);
  const t0 = Date.now();
  while (!(f.contentWindow && f.contentWindow.MathJax && f.contentWindow.MathJax.tex2svgPromise)) {
    if (Date.now() - t0 > 20000) throw new Error('không tải được MathJax (SVG)');
    await new Promise(r => setTimeout(r, 100));
  }
  await f.contentWindow.MathJax.startup.promise;
  svgWin = f.contentWindow; return svgWin;
}
function decodeEnt(s) { return new DOMParser().parseFromString(s, 'text/html').documentElement.textContent; }
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('img')); i.src = src; }); }
const EX_PT = 5.4;      // 1ex ≈ 5.4pt với chữ 12pt
async function mathToPng(tex, display) {
  const w = await getSvgMJ();
  const node = await w.MathJax.tex2svgPromise(tex, { display });
  const svg = node.querySelector('svg');
  const exW = parseFloat(svg.getAttribute('width')), exH = parseFloat(svg.getAttribute('height'));
  const va = parseFloat((svg.getAttribute('style') || '').replace(/.*vertical-align:\s*(-?[\d.]+)ex.*/, '$1')) || 0;
  const S = 4, pxW = exW * 8, pxH = exH * 8;
  svg.setAttribute('width', pxW + 'px'); svg.setAttribute('height', pxH + 'px');
  svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  let str = new XMLSerializer().serializeToString(svg).replace(/currentColor/g, '#000000');
  const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str));
  const cv = document.createElement('canvas'); cv.width = Math.ceil(pxW * S); cv.height = Math.ceil(pxH * S);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return { png: cv.toDataURL('image/png').split(',')[1], cx: Math.round(exW * EX_PT * 12700), cy: Math.round(exH * EX_PT * 12700), pos: Math.round(va * EX_PT * 2) };
}
async function remoteToPng(src) {
  try {
    const r = await fetch(src); const b = await r.blob(); const u = URL.createObjectURL(b);
    const img = await loadImg(u);
    const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    cv.getContext('2d').drawImage(img, 0, 0); URL.revokeObjectURL(u);
    const k = Math.min(1, 520 / img.naturalWidth);
    return { png: cv.toDataURL('image/png').split(',')[1], cx: Math.round(img.naturalWidth * k * 9525), cy: Math.round(img.naturalHeight * k * 9525), pos: 0 };
  } catch (e) { return null; }
}


// ── MathML → OMML (equation của Word) ──
const NARY = new Set(['∑','∏','∐','⋃','⋂','⋁','⋀','∫','∬','∭','∮']);
const ACC = { '^': '̂', 'ˆ': '̂', '~': '̃', '˜': '̃', '→': '⃗', '⃗': '⃗', '˙': '̇', '.': '̇', '¨': '̈', '´': '́', '`': '̀', 'ˇ': '̌', '¯': '̄' };
const DS = { C: 'ℂ', H: 'ℍ', N: 'ℕ', P: 'ℙ', Q: 'ℚ', R: 'ℝ', Z: 'ℤ' };
function dsMap(t) {
  return [...t].map(ch => {
    if (DS[ch]) return DS[ch];
    const c = ch.codePointAt(0);
    if (c >= 65 && c <= 90) return String.fromCodePoint(0x1D538 + c - 65);
    if (c >= 97 && c <= 122) return String.fromCodePoint(0x1D552 + c - 97);
    if (c >= 48 && c <= 57) return String.fromCodePoint(0x1D7D8 + c - 48);
    return ch;
  }).join('');
}
function mmlToOmml(mml) {
  const doc = new DOMParser().parseFromString(mml, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('mathml');
  let alnNext = false;
  const kids = n => [...n.childNodes].filter(c => c.nodeType === 1);
  const ln = n => n.localName;
  const cls = n => n.getAttribute('data-mjx-texclass') || '';
  const mt = n => n.textContent.replace(/[⁡-⁤\s]+/g, ' ').trim();
  function run(n) {
    let t = n.textContent.replace(/[⁡-⁤]/g, '');
    if (ln(n) !== 'mtext') t = t.replace(/\s+/g, '');
    if (!t) return '';
    const mv = n.getAttribute('mathvariant') || '';
    let sty = '';
    if (ln(n) === 'mtext' || ln(n) === 'ms') sty = '<m:nor/>';
    else if (mv === 'double-struck') { t = dsMap(t); sty = '<m:sty m:val="p"/>'; }
    else if (mv === 'bold') sty = '<m:sty m:val="b"/>';
    else if (mv === 'bold-italic') sty = '<m:sty m:val="bi"/>';
    else if (mv === 'normal' || (ln(n) === 'mi' && [...t].length > 1)) sty = '<m:sty m:val="p"/>';
    if (alnNext) { sty = '<m:aln/>' + sty; alnNext = false; }
    return `<m:r>${sty ? '<m:rPr>' + sty + '</m:rPr>' : ''}<w:rPr><w:rFonts w:ascii="Cambria Math" w:hAnsi="Cambria Math"/></w:rPr><m:t xml:space="preserve">${xe(t)}</m:t></m:r>`;
  }
  function firstMo(n) { return ln(n) === 'mo' ? n : (ln(n) === 'mrow' && kids(n)[0] && ln(kids(n)[0]) === 'mo' ? kids(n)[0] : null); }
  function lastMo(n) { return ln(n) === 'mo' ? n : (ln(n) === 'mrow' && kids(n).length && ln(kids(n).slice(-1)[0]) === 'mo' ? kids(n).slice(-1)[0] : null); }
  function naryInfo(n) {
    const t = ln(n), c = kids(n);
    if (t === 'mo' && NARY.has(mt(n))) return { chr: mt(n), kind: 'none' };
    if (['msub', 'msup', 'msubsup', 'munder', 'mover', 'munderover'].includes(t) && c[0] && ln(c[0]) === 'mo' && NARY.has(mt(c[0]))) {
      const under = t.startsWith('mun') || t === 'mover';
      let sub = null, sup = null;
      if (t === 'msub' || t === 'munder') sub = c[1];
      else if (t === 'msup' || t === 'mover') sup = c[1];
      else { sub = c[1]; sup = c[2]; }
      return { chr: mt(c[0]), sub, sup, loc: (under && !'∫∬∭∮'.includes(mt(c[0]))) ? 'undOvr' : 'subSup' };
    }
    return null;
  }
  function nary(info, e) {
    const loc = info.loc || 'subSup';
    return `<m:nary><m:naryPr><m:chr m:val="${xe(info.chr)}"/><m:limLoc m:val="${loc}"/>${info.sub ? '' : '<m:subHide m:val="1"/>'}${info.sup ? '' : '<m:supHide m:val="1"/>'}</m:naryPr><m:sub>${info.sub ? cv(info.sub) : ''}</m:sub><m:sup>${info.sup ? cv(info.sup) : ''}</m:sup><m:e>${e}</m:e></m:nary>`;
  }
  function seq(nodes) {
    let out = '';
    for (let i = 0; i < nodes.length; i++) {
      const info = naryInfo(nodes[i]);
      if (info) { let e = ''; if (i + 1 < nodes.length) { e = cv(nodes[i + 1]); i++; } out += nary(info, e); }
      else out += cv(nodes[i]);
    }
    return out;
  }
  function table(n, asEq) {
    const rows = kids(n).filter(r => ln(r) === 'mtr' || ln(r) === 'mlabeledtr');
    const align = (n.getAttribute('columnalign') || '');
    if (asEq || /right\s+left/.test(align)) {
      return '<m:eqArr>' + rows.map(r => '<m:e>' + kids(r).map((td, k) => { if (k > 0 && /right\s+left/.test(align)) alnNext = true; return seq(kids(td)) + (k < kids(r).length - 1 && !/right\s+left/.test(align) ? '<m:r><m:t xml:space="preserve">  </m:t></m:r>' : ''); }).join('') + '</m:e>').join('') + '</m:eqArr>';
    }
    return '<m:m>' + rows.map(r => '<m:mr>' + kids(r).map(td => '<m:e>' + seq(kids(td)) + '</m:e>').join('') + '</m:mr>').join('') + '</m:m>';
  }
  function delim(n) {
    const c = kids(n), fo = firstMo(c[0]), lo = lastMo(c[c.length - 1]);
    const b = mt(fo), e = mt(lo);
    const mid = c.slice(1, -1);
    const isCases = b === '{' && !e && mid.length === 1 && ln(mid[0]) === 'mtable';
    const inner = isCases ? table(mid[0], true) : seq(mid);
    return `<m:d><m:dPr><m:begChr m:val="${xe(b)}"/><m:endChr m:val="${xe(e)}"/></m:dPr><m:e>${inner}</m:e></m:d>`;
  }
  function cv(n) {
    const t = ln(n), c = kids(n);
    switch (t) {
      case 'mi': case 'mn': case 'mo': case 'mtext': case 'ms': return run(n);
      case 'mspace': case 'mglyph': return '';
      case 'mfrac':
        return `<m:f>${n.getAttribute('linethickness') === '0' ? '<m:fPr><m:type m:val="noBar"/></m:fPr>' : ''}<m:num>${cv(c[0])}</m:num><m:den>${cv(c[1])}</m:den></m:f>`;

      case 'mroot': return `<m:rad><m:radPr/><m:deg>${cv(c[1])}</m:deg><m:e>${cv(c[0])}</m:e></m:rad>`;
      case 'msup': return `<m:sSup><m:e>${cv(c[0])}</m:e><m:sup>${cv(c[1])}</m:sup></m:sSup>`;
      case 'msub': return `<m:sSub><m:e>${cv(c[0])}</m:e><m:sub>${cv(c[1])}</m:sub></m:sSub>`;
      case 'msubsup': return `<m:sSubSup><m:e>${cv(c[0])}</m:e><m:sub>${cv(c[1])}</m:sub><m:sup>${cv(c[2])}</m:sup></m:sSubSup>`;
      case 'mover': case 'munder': {
        const top = t === 'mover', a = c[1], at = a && ln(a) === 'mo' ? mt(a) : '';
        if (at === '¯' || at === '―' || at === '‾' || at === '_' ) return `<m:bar><m:barPr><m:pos m:val="${top ? 'top' : 'bot'}"/></m:barPr><m:e>${cv(c[0])}</m:e></m:bar>`;
        if (top && at && (a.getAttribute('accent') === 'true' || ACC[at])) return `<m:acc><m:accPr><m:chr m:val="${xe(ACC[at] || at)}"/></m:accPr><m:e>${cv(c[0])}</m:e></m:acc>`;
        return top ? `<m:limUpp><m:e>${cv(c[0])}</m:e><m:lim>${cv(c[1])}</m:lim></m:limUpp>` : `<m:limLow><m:e>${cv(c[0])}</m:e><m:lim>${cv(c[1])}</m:lim></m:limLow>`;
      }
      case 'munderover':
        return `<m:limUpp><m:e><m:limLow><m:e>${cv(c[0])}</m:e><m:lim>${cv(c[1])}</m:lim></m:limLow></m:e><m:lim>${cv(c[2])}</m:lim></m:limUpp>`;
      case 'mtable': return table(n, false);
      case 'menclose': return /box|roundedbox/.test(n.getAttribute('notation') || '') ? `<m:borderBox><m:e>${seq(c)}</m:e></m:borderBox>` : seq(c);
      case 'mrow': {
        if (c.length >= 2) {
          const f = firstMo(c[0]), l = lastMo(c[c.length - 1]);

          if (f && l && cls(n) === 'INNER' && cls(f) === 'OPEN') return delim(n);
        }
        return seq(c);
      }
      default: return seq(c);
    }

  return seq(kids(doc.documentElement));
}
async function mathToOmml(tex, display) {
  const w = await getSvgMJ();
  const mml = w.MathJax.tex2mml(tex, { display });
  if (/merror/.test(mml)) throw new Error('tex');
  const o = mmlToOmml(mml);
  if (!o) throw new Error('empty');
  return o;
}

const MATH_RE = /\\begin\{(align\*?|aligned|gather\*?|equation\*?|multline\*?|cases)\}[\s\S]*?\\end\{\1\}|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$|\\\([\s\S]*?\\\)|\$[^$\n]+?\$/g;
const xe = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

async function exportDocx(o, say) {
  say('Đang tải thư viện…');
  if (!window.JSZip) await loadScript(JSZIP_URL);
  let html = docHtml(o);
  // 1) tách công thức -> <img data-m>
  const maths = [];
  html = html.replace(MATH_RE, m => {
    let tex = m, display = false;
    if (m.startsWith('\\[')) { tex = m.slice(2, -2); display = true; }
    else if (m.startsWith('$$')) { tex = m.slice(2, -2); display = true; }
    else if (m.startsWith('\\(')) { tex = m.slice(2, -2); }
    else if (m.startsWith('$')) { tex = m.slice(1, -1); }
    else display = true;
    return `<img data-m="${maths.push({ tex: decodeEnt(tex), display }) - 1}">`;
  });
  const root = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html').body;
  // 2) tạo ảnh cho công thức + ảnh ngoài
  const media = [], info = new Map(), cache = new Map();
  const imgs = [...root.querySelectorAll('img')];
  let done = 0;
  for (const el of imgs) {
    say(`Đang xử lý công thức/hình ${++done}/${imgs.length}…`);
    let r = null, display = false;
    if (el.dataset.m != null) {
      const m = maths[+el.dataset.m]; display = m.display;
      const key = (display ? 'D' : 'I') + m.tex;
      if (!cache.has(key)) {
        let v = null;
        if (o.eq) { try { v = { omml: await mathToOmml(m.tex, m.display) }; } catch (e) { v = null; } }
        if (!v) { try { v = await mathToPng(m.tex, m.display); } catch (e) { v = null; } }
        cache.set(key, v);
      }
      r = cache.get(key);
      if (!r) { info.set(el, { text: m.tex }); continue; }
      if (r.omml) { info.set(el, { omml: r.omml, display }); continue; }
    } else {
      const src = el.getAttribute('src') || '';
      r = await remoteToPng(src);
      display = true;
      if (!r) { info.set(el, { text: '[Hình: ' + src + ']' }); continue; }
    }
    media.push(r.png);
    info.set(el, { rid: 'rIdImg' + media.length, cx: r.cx, cy: r.cy, pos: r.pos, display, n: media.length });
  }
  // 3) HTML -> OOXML
  say('Đang dựng file Word…');
  let docPrId = 1;
  const rPr = f => '<w:rPr><w:rFonts w:ascii="' + (f.mono ? 'Consolas' : 'Times New Roman') + '" w:hAnsi="' + (f.mono ? 'Consolas' : 'Times New Roman') + '" w:cs="' + (f.mono ? 'Consolas' : 'Times New Roman') + '"/>'
    + (f.b ? '<w:b/>' : '') + (f.i ? '<w:i/>' : '') + (f.pos ? `<w:position w:val="${f.pos}"/>` : '') + (f.sz ? `<w:sz w:val="${f.sz}"/><w:szCs w:val="${f.sz}"/>` : '') + (f.u ? '<w:u w:val="single"/>' : '') + '</w:rPr>';
  const run = (t, f) => `<w:r>${rPr(f)}<w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;
  const imgRun = (d, f) => `<w:r>${rPr({ pos: d.pos })}<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${d.cx}" cy="${d.cy}"/><wp:docPr id="${docPrId}" name="Hinh${docPrId++}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${d.n}" name="img${d.n}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${d.rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${d.cx}" cy="${d.cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
  const P = (runs, p = {}) => `<w:p><w:pPr>${p.keep ? '<w:keepNext/>' : ''}<w:spacing w:before="${p.before || 0}" w:after="${p.after != null ? p.after : 80}"/>${(p.left || p.hang) ? `<w:ind w:left="${p.left || 0}"${p.hang ? ` w:hanging="${p.hang}"` : ''}/>` : ''}${p.jc ? `<w:jc w:val="${p.jc}"/>` : ''}</w:pPr>${runs}</w:p>`;

  function conv(el, base) {
    const out = []; let runs = [], po = Object.assign({}, base);
    const flush = () => { if (runs.length) out.push(P(runs.join(''), po)); runs = []; };
    function walk(n, f) {
      if (n.nodeType === 3) {
        const t = n.nodeValue.replace(/\s+/g, ' ');
        if (t && !(t === ' ' && !runs.length)) runs.push(run(t, f));
        return;
      }
      if (n.nodeType !== 1) return;
      const tag = n.tagName, cls = n.className || '';
      if (tag === 'BR') { runs.push('<w:r><w:br/></w:r>'); return; }

        const d = info.get(n); if (!d) return;
        if (d.text) { runs.push(run(d.text, f)); return; }
        if (d.omml) {
          if (d.display) { flush(); out.push(`<w:p><w:pPr><w:spacing w:before="40" w:after="80"/></w:pPr><m:oMathPara><m:oMathParaPr><m:jc m:val="center"/></m:oMathParaPr><m:oMath>${d.omml}</m:oMath></m:oMathPara></w:p>`); }
          else runs.push(`<m:oMath>${d.omml}</m:oMath>`);
          return;
        }
        if (d.display) { flush(); out.push(P(imgRun(d, f), { jc: 'center', after: 80 })); return; }
        runs.push(imgRun(d, f)); return;
      }
      if (tag === 'TABLE') { flush(); out.push(table(n)); return; }
      if (tag === 'UL' || tag === 'OL') {
        flush(); let k = 0;
        [...n.children].forEach(li => {
          const prev = po; po = Object.assign({}, base, { left: 720, hang: 360, after: 40 });
          runs.push(run(tag === 'UL' ? '•  ' : (++k) + '. ', f));
          [...li.childNodes].forEach(c => walk(c, f)); flush(); po = prev;
        });
        return;
      }
      if (tag === 'DIV' || tag === 'P') {
        flush(); const prev = po; let nf = f;
        po = Object.assign({}, base);
        if (/\bpd-center\b/.test(cls)) po.jc = 'center';
        if (/\bpd-t\b/.test(cls)) { nf = Object.assign({}, f, { b: true, sz: 30 }); po.after = 120; }
        if (/\bpd-h\b/.test(cls)) { nf = Object.assign({}, f, { b: true, sz: 26 }); po.jc = 'center'; po.before = 280; po.keep = true; }
        if (/\bq\b/.test(cls)) { po.after = 80; po.before = 120; po.keep = true; }
        if (/\bc\b/.test(cls)) { po.left = 360; po.after = 30; if (/\bok\b/.test(cls)) nf = Object.assign({}, f, { b: true }); }
        if (/\bsol\b/.test(cls)) { po.left = 360; po.after = 100; }
        [...n.childNodes].forEach(c => walk(c, nf)); flush(); po = prev; return;
      }
      let nf = f;
      if (tag === 'STRONG' || tag === 'B') nf = Object.assign({}, f, { b: true });
      else if (tag === 'EM' || tag === 'I') nf = Object.assign({}, f, { i: true });
      else if (tag === 'U') nf = Object.assign({}, f, { u: true });
      else if (tag === 'CODE') nf = Object.assign({}, f, { mono: true });
      [...n.childNodes].forEach(c => walk(c, nf));
    }
    [...el.childNodes].forEach(c => walk(c, {}));
    flush(); return out;
  }
  function table(t) {
    const rows = [...t.querySelectorAll('tr')]; const nc = Math.max(...rows.map(r => r.children.length), 1);
    const bd = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="808080"/>`).join('');
    return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${bd}</w:tblBorders><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${'<w:gridCol w:w="' + Math.floor(9000 / nc) + '"/>'.repeat(nc)}</w:tblGrid>`
      + rows.map(r => '<w:tr>' + [...r.children].map(c => { const ps = conv(c, { after: 20, jc: t.querySelector('b') ? 'center' : undefined }).join('') || P('', { after: 0 }); return `<w:tc><w:tcPr><w:tcW w:w="${Math.floor(9000 / nc)}" w:type="dxa"/></w:tcPr>${ps}</w:tc>`; }).join('') + '</w:tr>').join('')
      + '</w:tbl>' + P('', { after: 60 });

  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"';
  const zip = new JSZip();
  zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
  zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="vi-VN"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>');
  zip.file('word/_rels/document.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdSt" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    + media.map((_, i) => `<Relationship Id="rIdImg${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/img${i + 1}.png"/>`).join('') + '</Relationships>');
  zip.file('word/document.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1417" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  media.forEach((b, i) => zip.file(`word/media/img${i + 1}.png`, b, { base64: true }));

<style>
.scroll-fab { position: fixed; right: 16px; bottom: 84px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.scroll-fab button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-size: 18px; line-height: 1; cursor: pointer; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, background .15s, color .15s; }

</style>
<div class="scroll-fab">
  <button id="goTop" title="Lên đầu trang" aria-label="Lên đầu trang">↑</button>
  <button id="goBottom" title="Xuống cuối trang" aria-label="Xuống cuối trang">↓</button>
</div>
<script>
(function () {
  const up = document.getElementById('goTop'), down = document.getElementById('goBottom');
  function update() {
    const y = window.scrollY, max = document.documentElement.scrollHeight - window.innerHeight;
    up.classList.toggle('show', y > 300);
    down.classList.toggle('show', max - y > 300);
  }
  up.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  down.addEventListener('click', () => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' }));
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  setInterval(update, 1000);   // nội dung tải/lọc xong làm trang dài ra
  update();
})();
</script>
